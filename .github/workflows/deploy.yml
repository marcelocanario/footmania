name: Deploy Footmania

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: footmania_ci
          POSTGRES_PASSWORD: footmania_ci
          POSTGRES_DB: footmania_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U footmania_ci -d footmania_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://footmania_ci:footmania_ci@127.0.0.1:5432/footmania_ci?schema=test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create isolated test schema
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        # psql is not guaranteed on the hosted runner, but the prisma CLI is
        # already installed by the dependency step above.
        run: |
          npx prisma db execute --url "$TEST_DATABASE_URL" --stdin <<'SQL'
          CREATE SCHEMA IF NOT EXISTS test;
          SQL

      - name: Apply migrations to isolated test schema
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: test
        run: npm run db:upgrade

      - name: Run unit tests
        working-directory: backend
        env:
          NODE_ENV: test
        # vitest.config.ts serializes the suite (forked pool, maxWorkers=1) so
        # worker RPC updates cannot time out on CPU-constrained runners.
        run: npm test

      - name: Run integration tests against isolated schema
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm run test:integration

      - name: Validate Compose configuration
        shell: bash
        run: |
          cp deploy/production.env.example .env
          docker compose config

      - name: Build production container images
        run: docker compose build

  deploy:
    name: Deploy to homelab
    if: github.ref == 'refs/heads/production'
    needs: build-and-test
    runs-on: [self-hosted, footmania]
    concurrency:
      group: footmania-production
      cancel-in-progress: false
    steps:
      - name: Configure fetch credentials
        # The self-hosted runner does not go through actions/checkout, so its
        # plain `git fetch` would depend on a stored credential helper. Let the
        # job's own read-only GITHUB_TOKEN cover fetch. No-op for SSH remotes.
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Update, migrate, and restart production containers
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/apps/footmania/container
          git fetch origin production
          git checkout -B production origin/production
          git reset --hard origin/production

          test -f .env
          set -a
          . ./.env
          set +a
          : "${DATABASE_URL:?DATABASE_URL is required in .env}"
          : "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required in .env}"
          : "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required in .env}"
          : "${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required in .env}"
          : "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required in .env}"

          docker compose build
          # This command runs migrations only. It never runs the application
          # worker, and it never points at the CI/test schema.
          docker compose run --rm backend npm run db:upgrade
          docker compose up -d --build --remove-orphans --wait --wait-timeout 300
          curl --fail --silent --show-error http://127.0.0.1:18085/api/health
          curl --fail --silent --show-error http://127.0.0.1:8084/healthz
